name: Test APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk
          generated-code: false   # run build_runner + slang here (no codegen artifact in this run)

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # No android/key.properties -> build.gradle falls back to debug signing (installable).
      - name: Build APKs
        run: make android-apk-release

      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/*arm64-v8a*.apk out/Hiddify-test-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/Hiddify-test-universal.apk

      - uses: actions/upload-artifact@v6
        with:
          name: hiddify-test-apk
          path: out
          retention-days: 7
          compression-level: 0
